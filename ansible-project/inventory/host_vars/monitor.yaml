---
# Network interfaces configuration
monitor_interfaces:
  internal:
    interface: ens160
    ip: "192.168.216.11"
    gateway: "192.168.216.1"
    netmask: "24"
    zone: internal

  monitorproxy:
    interface: ens224
    ip: "192.168.217.2"
    netmask: "24"
    zone: monitorproxy

# Firewall zones
firewall_zones:
  internal:
    interface: "{{ monitor_interfaces.internal.interface }}"
    services: ["ssh"]
    ports:
      - "3100/tcp" # Grafana Loki
    forward: false
    masquerade: false

  monitorproxy:
    interface: "{{ monitor_interfaces.monitorproxy.interface }}"
    services: []
    ports:
      - "3000/tcp" # HTTP
    forward: false
    masquerade: false

# Prometheus Scrape Jobs
prometheus_scrape_jobs:
  - job_name: node_exporter
    static_configs:
      - targets:
          - localhost:9100
        labels:
          host: monitor
          role: monitor

      - targets:
          - 192.168.216.1:9100
        labels:
          host: nat
          role: gateway

      - targets:
          - 192.168.216.4:9100
        labels:
          host: proxy
          role: reverse-proxy

      - targets:
          - 192.168.216.8:9100
        labels:
          host: pods
          role: application

      - targets:
          - 192.168.216.9:9100
        labels:
          host: redis
          role: cache

      - targets:
          - 192.168.216.10:9100
        labels:
          host: ipa
          role: ipa

  - job_name: haproxy_exporter
    static_configs:
      - targets:
          - 192.168.216.4:9101
        labels:
          host: proxy
          role: reverse-proxy

  - job_name: redis_exporter
    static_configs:
      - targets:
          - 192.168.216.9:9121
        labels:
          host: redis

  - job_name: cadvisor
    static_configs:
      - targets:
          - 192.168.216.8:8081
        labels:
          host: pods

  - job_name: mysql_exporter
    static_configs:
      - targets:
          - 192.168.216.8:9104
        labels:
          host: pods

  - job_name: postgres_exporter
    static_configs:
      - targets:
          - 192.168.216.8:9187
        labels:
          host: pods      

node_exporter_listen_address: "localhost"
fluent_bit_loki_host: "localhost"


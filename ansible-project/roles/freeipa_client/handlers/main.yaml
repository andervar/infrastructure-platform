---
- name: restart NetworkManager
  ansible.builtin.systemd:
    name: NetworkManager
    state: restarted
  become: true

- name: Restart chronyd
  ansible.builtin.service:
    name: "{{ ipa_chrony_service }}"
    state: restarted

- name: Restart sssd
  ansible.builtin.service:
    name: sssd
    state: restarted

- name: Restart oddjobd
  ansible.builtin.service:
    name: oddjobd
    state: restarted

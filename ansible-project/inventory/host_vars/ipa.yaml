---
# Network interfaces configuration
ipa_interfaces:
  external:
    interface: ens224
    ip: "172.24.133.219"
    netmask: "24"
    gateway: "{{ public_network_gateway }}"
    zone: external
  
  internal:
    interface: ens160
    ip: "192.168.216.10"
    netmask: "24"
    zone: internal

# Firewall zones
firewall_zones:
  external:
    interface: "{{ ipa_interfaces.external.interface }}"
    services: ["https"]
    masquerade: false

  internal:
    interface: "{{ ipa_interfaces.internal.interface }}"
    services:
      - ssh
    ports:
      # LDAP/LDAPS
      - "389/tcp"
      - "636/tcp"
      # Kerberos
      - "88/tcp"
      - "88/udp"
      # kpasswd
      - "464/tcp"
      - "464/udp"
      # DNS
      - "53/tcp"
      - "53/udp"
      # NTP
      - "123/udp"
    masquerade: false

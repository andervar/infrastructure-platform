---
- name: Restart node_exporter
  ansible.builtin.systemd:
    name: node_exporter
    state: restarted
    daemon_reload: true

- name: Restart redis_exporter
  ansible.builtin.systemd:
    name: redis_exporter
    state: restarted
    daemon_reload: true

- name: Restart postgres_exporter
  ansible.builtin.systemd:
    name: postgres_exporter
    state: restarted
    daemon_reload: true

- name: Restart mysql_exporter
  ansible.builtin.systemd:
    name: mysql_exporter
    state: restarted
    daemon_reload: true

- name: Restart cadvisor
  ansible.builtin.systemd:
    name: cadvisor
    state: restarted
    daemon_reload: true

---
- name: Get UID of podman user
  ansible.builtin.command: id -u {{ podman_user }}
  register: podman_uid_result
  changed_when: false

- name: Set podman_uid fact
  ansible.builtin.set_fact:
    podman_uid: "{{ podman_uid_result.stdout }}"

- name: Enable and start podman.socket (user scope)
  ansible.builtin.systemd:
    name: podman.socket
    scope: user
    enabled: true
    state: started
  become: true
  become_user: "{{ podman_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ podman_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ podman_uid }}/bus"

- name: Verify podman.sock exists
  ansible.builtin.wait_for:
    path: "/run/user/{{ podman_uid }}/podman/podman.sock"
    state: present
    timeout: 15

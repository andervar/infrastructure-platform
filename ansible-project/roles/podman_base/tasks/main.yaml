---
- name: Install Podman packages
  ansible.builtin.dnf:
    name: "{{ podman_packages }}"
    state: present
  become: true

- name: Ensure lingering is enabled for user
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ podman_user }}
  become: true
  changed_when: false
  when: podman_lingering_enabled | default(true)

- name: Create Podman directories structure
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/{{ item }}"
    state: directory
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
    mode: '0755'
  loop: "{{ podman_work_directories }}"

- name: Set secure permissions on .config directory
  ansible.builtin.file:
    path: "/home/{{ podman_user }}/.config"
    mode: '0700'
    owner: "{{ podman_user }}"
    group: "{{ podman_user }}"
  become: true
  become_user: "{{ podman_user }}"

- name: Check if subuid is configured for user
  ansible.builtin.command:
    cmd: grep -c "{{ podman_user }}" /etc/subuid
  register: subuid_check
  changed_when: false
  become: true

- name: Configure subuid for rootless Podman
  ansible.builtin.command:
    cmd: usermod --add-subuids 100000-165535 {{ podman_user }}
  become: true
  when: subuid_check.stdout | int == 0

- name: Check if subgid is configured for user
  ansible.builtin.command:
    cmd: usermod --add-subgids 100000-165535 {{ podman_user }}
  become: true
  when: subuid_check.stdout | int == 0

- name: Verify Podman installation
  ansible.builtin.command: podman --version
  register: podman_version
  changed_when: false
  become: true
  become_user: "{{ podman_user }}"

- name: Display Podman version
  ansible.builtin.debug:
    msg: "Podman version: {{ podman_version.stdout }}"
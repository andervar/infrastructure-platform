---
- name: Install haproxy package
  ansible.builtin.dnf:
    name: "{{ haproxy_package }}"
    state: present
  notify: reload haproxy

- name: Ensure SSL directories exist with correct permissions
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /etc/ssl/private
    - /etc/ssl/certs

- name: Set secure permissions on private directory
  ansible.builtin.file:
    path: /etc/ssl/private
    mode: '0700'

- name: Deploy OpenSSL configuration template
  ansible.builtin.template:
    src: openssl.cnf.j2
    dest: "/etc/pki/tls/{{ inventory_hostname }}.cnf"
    mode: '0644'

- name: Generate SSL certificate and key
  ansible.builtin.command:
    cmd: |
      openssl req -x509 -nodes -days {{ haproxy_ssl.days }} -newkey rsa:{{ haproxy_ssl.key_size }} \
        -keyout {{ haproxy_ssl.key_path }} \
        -out {{ haproxy_ssl.crt_path }} \
        -config /etc/pki/tls/{{ inventory_hostname }}.cnf
    creates: "{{ haproxy_ssl.key_path }}"

- name: Set permissions on SSL key
  ansible.builtin.file:
    path: "{{ haproxy_ssl.key_path }}"
    mode: '0600'

- name: Generate PEM file for HAProxy
  ansible.builtin.shell:
    cmd: |
      cat {{ haproxy_ssl.crt_path }} \
          {{ haproxy_ssl.key_path }} \
          > {{ haproxy_ssl.cert_path }}
    creates: "{{ haproxy_ssl.cert_path }}"

- name: Set permissions on PEM file
  ansible.builtin.file:
    path: "{{ haproxy_ssl.cert_path }}"
    mode: '0600'

- name: Deploy HAProxy configuration from template
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    mode: '0644'
    validate: haproxy -c -f %s
  notify: reload haproxy

- name: Configure SELinux booleans for haproxy
  ansible.posix.seboolean:
    name: "{{ item }}"
    state: true
    persistent: true
  loop:
    - httpd_can_network_connect
    - haproxy_connect_any

- name: Ensure haproxy is started and enabled
  ansible.builtin.systemd:
    name: "{{ haproxy_service }}"
    state: started
    enabled: true